spring:
  application:
    name: search-service
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:   # only used by the dead-letter recoverer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      observation-enabled: true
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    elasticsearch:
      repositories:
        enabled: false

search:
  topic: claims.events
  index: claims              # current state per claim (search API)
  event-log-index: claim-events   # append-only fact log (Kibana)

platform:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}   # same key as claim-service
    jwt-issuer: claim-service

logging:
  loki:
    url: ${LOKI_URL:}            # empty = console only

server:
  port: 8081

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true      # Grafana p95 panels need buckets, not just totals
        spring.kafka.listener: true
  tracing:
    sampling:
      probability: 1.0            # demo: trace everything; production would sample
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      export:
        enabled: ${TRACING_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
