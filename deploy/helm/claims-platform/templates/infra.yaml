apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  password: {{ .Values.infra.postgres.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  10-databases.sh: |
    #!/bin/bash
    set -e
    {{- range .Values.infra.postgres.databases }}
    {{- if ne . "claims" }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "CREATE DATABASE {{ . }};"
    {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: claims }
            - { name: POSTGRES_USER, value: {{ .Values.infra.postgres.user }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.infra.postgres.user }}"] }
          resources: { limits: { memory: 256Mi } }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka } }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          ports: [{ containerPort: 9092 }]
          resources: { limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ port: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: elasticsearch } }
  template:
    metadata: { labels: { app.kubernetes.io/name: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.infra.elasticsearch.image }}
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: {{ .Values.infra.elasticsearch.javaOpts | quote }} }
          ports: [{ containerPort: 9200 }]
          resources: { limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch }
spec:
  selector: { app.kubernetes.io/name: elasticsearch }
  ports: [{ port: 9200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.infra.redis.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources: { limits: { memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379 }]
{{- if .Values.infra.kibana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kibana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kibana } }
    spec:
      containers:
        - name: kibana
          image: {{ .Values.infra.kibana.image }}
          env:
            - { name: ELASTICSEARCH_HOSTS, value: http://elasticsearch:9200 }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=512" }
            - { name: TELEMETRY_ENABLED, value: "false" }
          ports: [{ containerPort: 5601 }]
          resources: { limits: { memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kibana }
spec:
  selector: { app.kubernetes.io/name: kibana }
  ports: [{ port: 5601 }]
{{- end }}
