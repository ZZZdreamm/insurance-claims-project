{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "claims.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "claims.labels" (dict "name" $name "root" $) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: {{ if hasPrefix "/actuator" $svc.health }}/actuator/prometheus{{ else }}/metrics{{ end }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}:{{ $.Values.imageTag }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- if hasPrefix "/actuator" $svc.health }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.javaOpts | quote }}
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: auth-secrets, key: jwt-secret }
            {{- end }}
            {{- if or (eq $name "claim-service") (eq $name "assessment-service") }}
            - name: SERVICE_ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef: { name: auth-secrets, key: service-account-password }
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $.Values.infra.postgres.user }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: password }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ $svc.health }}, port: {{ $svc.port }} }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ $svc.health }}, port: {{ $svc.port }} }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "claims.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
