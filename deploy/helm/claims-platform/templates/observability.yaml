{{- if .Values.infra.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
data:
  prometheus.yml: |
    global: { scrape_interval: 10s }
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+) }
          - { source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: ([^:]+)(?::\d+)?;(\d+), replacement: $1:$2, target_label: __address__ }
          - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: replace, target_label: job }
  loki.yml: |
{{ .Files.Get "files/loki.yml" | indent 4 }}
  tempo.yml: |
{{ .Files.Get "files/tempo.yml" | indent 4 }}
  datasources.yml: |
{{ .Files.Get "files/datasources.yml" | indent 4 }}
  dashboards.yml: |
    apiVersion: 1
    providers: [{ name: claims, type: file, options: { path: /var/lib/grafana/dashboards } }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  claims-platform.json: |
{{ .Files.Get "files/claims-platform.json" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-pod-reader }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-pod-reader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-pod-reader }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: {{ .Release.Namespace }} }]
{{- range $comp := list "prometheus" "loki" "tempo" "grafana" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $comp }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ $comp }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ $comp }} } }
    spec:
      {{- if eq $comp "prometheus" }}
      serviceAccountName: prometheus
      {{- end }}
      containers:
        - name: {{ $comp }}
          image: {{ index $.Values.infra.observability $comp }}
          {{- if eq $comp "prometheus" }}
          args: ["--config.file=/etc/config/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          {{- else if eq $comp "loki" }}
          args: ["-config.file=/etc/config/loki.yml"]
          ports: [{ containerPort: 3100 }]
          {{- else if eq $comp "tempo" }}
          args: ["-config.file=/etc/config/tempo.yml"]
          ports: [{ containerPort: 3200 }, { containerPort: 4318 }]
          {{- else }}
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          ports: [{ containerPort: 3000 }]
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/config }
            {{- if eq $comp "grafana" }}
            - { name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml }
            - { name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            {{- end }}
          resources: { limits: { memory: 256Mi } }
      volumes:
        - name: config
          configMap: { name: observability-config }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata: { name: {{ $comp }} }
spec:
  selector: { app.kubernetes.io/name: {{ $comp }} }
  ports:
    {{- if eq $comp "prometheus" }}
    - { port: 9090 }
    {{- else if eq $comp "loki" }}
    - { port: 3100 }
    {{- else if eq $comp "tempo" }}
    - { name: http, port: 3200 }
    - { name: otlp, port: 4318 }
    {{- else }}
    - { port: 3000 }
    {{- end }}
{{- end }}
{{- end }}
