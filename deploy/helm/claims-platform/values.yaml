# Images are built locally and loaded into kind by deploy/kind/up.sh; no registry needed.
imageTag: local
imagePullPolicy: IfNotPresent

services:
  claim-service:
    image: claims/claim-service
    port: 8080
    replicas: 1
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claims
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      TRACING_ENABLED: "true"
      LOKI_URL: http://loki:3100
    resources: { requests: { cpu: 100m, memory: 320Mi }, limits: { memory: 512Mi } }
    health: /actuator/health
  payout-service:
    image: claims/payout-service
    port: 8082
    replicas: 1
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payout
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      TRACING_ENABLED: "true"
      LOKI_URL: http://loki:3100
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 384Mi } }
    health: /actuator/health
  search-service:
    image: claims/search-service
    port: 8081
    replicas: 1
    env:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      TRACING_ENABLED: "true"
      LOKI_URL: http://loki:3100
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 384Mi } }
    health: /actuator/health
  assessment-service:
    image: claims/assessment-service
    port: 8000
    replicas: 1
    env:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLAIM_SERVICE_URL: http://claim-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 384Mi } }
    health: /health
  adjuster-console:
    image: claims/adjuster-console
    port: 3000
    replicas: 1
    env:
      NEXT_PUBLIC_CLAIM_API: http://localhost:8080   # browser-side; port-forward claim-service to 8080
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
    health: /

javaOpts: "-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xmx256m"

# Dev-grade infrastructure: single replicas, emptyDir storage. For anything beyond a demo
# cluster use the operators/charts (CloudNativePG, Strimzi, ECK) — deliberately not vendored here.
infra:
  postgres:
    image: postgres:16-alpine
    user: claims
    password: claims
    databases: [claims, payout]
  redis:
    image: redis:7-alpine
  kafka:
    image: apache/kafka-native:3.8.0
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    javaOpts: "-Xms512m -Xmx512m"
  kibana:
    enabled: true
    image: docker.elastic.co/kibana/kibana:8.17.0
  observability:
    enabled: true
    prometheus: prom/prometheus:v3.1.0
    loki: grafana/loki:3.3.2
    tempo: grafana/tempo:2.7.0
    grafana: grafana/grafana:11.4.0
