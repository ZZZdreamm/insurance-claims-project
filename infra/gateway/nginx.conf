# Round-robin gateway in front of the scalable services. Docker's embedded DNS returns every
# replica's address for a service name; resolving through a variable makes nginx re-resolve
# instead of pinning the single IP it saw at startup.
worker_processes 1;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  client_max_body_size 50m;

  server {
    listen 8080;
    location / {
      set $upstream claim-service;
      proxy_pass http://$upstream:8080;
    }
  }
  server {
    listen 8082;
    location / {
      set $upstream payout-service;
      proxy_pass http://$upstream:8082;
    }
  }
}
