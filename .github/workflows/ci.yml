name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      perf:
        description: "also run the Testcontainers performance ITs (mvn verify -Dperf)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest   # Docker is available here, so Testcontainers tests run for real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify ${{ inputs.perf && '-Dperf' || '' }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'

  adjuster-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adjuster-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: adjuster-console/package-lock.json
      - run: npm ci
      - run: npm run build

  assessment-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assessment-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/claims-platform
      - run: helm template claims deploy/helm/claims-platform > /dev/null

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain docker instead of trivy-action: the marketplace action broke twice on deleted
      # upstream tags; these exact commands are also runnable (and were verified) locally.
      # CRITICAL vulnerabilities with a published fix fail the build; offline-scan avoids
      # Maven Central rate limits during pom resolution.
      - name: Trivy gate (CRITICAL, fixed only)
        run: |
          docker run --rm -v "$PWD:/repo" -v "$HOME/.trivy-cache:/root/.cache" aquasec/trivy:0.58.1 \
            fs --scanners vuln --severity CRITICAL --ignore-unfixed --offline-scan --timeout 15m \
            --db-repository ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db,mirror.gcr.io/aquasec/trivy-db \
            --exit-code 1 --quiet /repo
      - name: Trivy report (HIGH+CRITICAL)
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" -v "$HOME/.trivy-cache:/root/.cache" aquasec/trivy:0.58.1 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --offline-scan --timeout 15m \
            --db-repository ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db,mirror.gcr.io/aquasec/trivy-db \
            --format json --output /repo/trivy-report.json --quiet /repo
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate CycloneDX SBOM (aggregate)
        run: mvn -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
