version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/adjuster-console"
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: "/assessment-service"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/claim-service", "/payout-service", "/search-service", "/assessment-service", "/adjuster-console", "/payment-gateway-simulator", "/infra/jenkins"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
