spring:
  application:
    name: claim-service
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${SPRING_DATASOURCE_USERNAME:claims}
    password: ${SPRING_DATASOURCE_PASSWORD:claims}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: claim-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
      observation-enabled: true

claims:
  topics:
    claims: claims.events         # produced: every claim fact
    assessment: assessment.events # consumed: ASSESSMENT_COMPLETED from assessment-service
    payout: payout.events         # consumed: PAYOUT_ISSUED / PAYOUT_FAILED / RESERVATION_REJECTED
  review:
    sla: PT48H                    # adjuster review SLA; escalation is non-blocking
  assessment:
    timeout: PT2M                 # no ASSESSMENT_COMPLETED within this -> in-process heuristic fallback
  scheduler:
    interval-ms: 15000
  cors:
    allowed-origins: http://localhost:3000
  kafka:
    partitions: 3
  outbox:
    poll-interval-ms: 1000
    batch-size: 100

logging:
  loki:
    url: ${LOKI_URL:}            # empty = console only

server:
  port: 8080
  error:
    include-message: always

management:
  tracing:
    sampling:
      probability: 1.0            # demo: trace everything; production would sample
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      export:
        enabled: ${TRACING_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  main:
    lazy-initialization: true
  jpa:
    show-sql: true
logging:
  level:
    com.kmultan.claims: DEBUG
